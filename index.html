<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flex Driver Hub</title>
<meta name="theme-color" content="#1e3846">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flex Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-column phone app, summary before detail, sticky bottom tab bar. Road-sign type, lane-paint accent. */
  --ink:#15212b; --paper:#eef1f0; --card:#ffffff; --line:#d5dcd9; --muted:#58676d;
  --accent:#f2b705; --accent-ink:#1d1600; --road:#1e3846; --road-ink:#f3f6f5;
  --good:#1d7449; --warn:#8a5200; --warn-bg:#fff3d1; --bad:#b3261e; --bad-bg:#fde8e6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ecea; --paper:#0e161b; --card:#16222a; --line:#293943; --muted:#93a4aa;
    --accent:#f5c22e; --accent-ink:#1d1600; --road:#0a1318; --road-ink:#eef3f1;
    --good:#5cc48d; --warn:#f0b450; --warn-bg:#2a2210; --bad:#ff8a80; --bad-bg:#3a1714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ecea; --paper:#0e161b; --card:#16222a; --line:#293943; --muted:#93a4aa;
  --accent:#f5c22e; --accent-ink:#1d1600; --road:#0a1318; --road-ink:#eef3f1;
  --good:#5cc48d; --warn:#f0b450; --warn-bg:#2a2210; --bad:#ff8a80; --bad-bg:#3a1714;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.shell{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{background:var(--road);color:var(--road-ink);padding:18px 16px 22px;position:relative}
.top::after{content:"";position:absolute;left:16px;right:16px;bottom:8px;height:4px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 26px,transparent 26px 44px);opacity:.9}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:28px;text-transform:uppercase}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.top .sub{margin-top:4px;font-size:15px;opacity:.85}

main{padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.banner{border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:15px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink)}
.banner.warn strong{color:var(--warn)}
.banner.info{background:var(--card);border-color:var(--line);color:var(--muted)}
.banner .linkbtn{justify-self:start}

.hours{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:10px}
.hours .eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hours .big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1}
.hours .big.over{color:var(--bad)}
.bar{height:14px;border-radius:7px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden;position:relative}
.bar span{display:block;height:100%;background:var(--accent);border-radius:7px}
.bar.over span{background:var(--bad)}
.hours .meta{font-size:15px;color:var(--muted)}

.tot h2{font-size:22px}
.tot-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.tot-head .count{font-size:14px;color:var(--muted)}
.tot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot-grid .k{font-size:13px;color:var(--muted)}
.tot-grid .v{font-size:19px;font-weight:600}
.tot-grid .v.spend{color:var(--good)}
.tot-foot{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.tot-foot b{color:var(--ink);font-weight:600}

.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost-danger{color:var(--bad)}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:6px 0;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:40px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:26px}
.section-head .sub{font-size:14px;color:var(--muted)}

.route{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;border-left:6px solid var(--accent)}
.route.edited{border-left-color:var(--road)}
.route-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.route-date{font-weight:700}
.route-time{color:var(--muted);font-size:15px}
.route-money{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.route-money span{color:var(--muted)}
.route-money b{color:var(--ink);font-weight:600}
.route-notes{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ex{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ed{background:color-mix(in srgb,var(--road) 14%,transparent);color:var(--ink);border-color:transparent}
.chip.mid{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}

form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.field .err{font-size:14px;color:var(--bad);font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;min-height:50px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:17px}
textarea{min-height:84px;resize:vertical}
input[aria-invalid="true"]{border-color:var(--bad)}
.prefix{position:relative}
.prefix::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.prefix input{padding-left:26px}
.preview{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:15px}
.preview .k{color:var(--muted)}
.preview .v{text-align:right;font-weight:600}
.preview h3{grid-column:1/-1;font-size:17px;margin-bottom:2px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:48px;border:0;background:var(--card);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--road);color:var(--road-ink)}

.csv{display:grid;gap:10px}
.csv textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:160px;white-space:pre;overflow:auto}

.checks{display:grid;gap:6px;font-size:15px}
.check{display:flex;gap:10px;align-items:flex-start}
.check .mark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.check.pass .mark{background:var(--good)}
.check.fail .mark{background:var(--bad)}
.check small{display:block;color:var(--muted)}
.checks-sum{font-weight:700}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;gap:6px}
nav.tabs button{min-height:56px;border:0;border-radius:12px;background:transparent;font-weight:600;font-size:14px;cursor:pointer;display:grid;place-items:center;gap:2px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--muted) 12%,transparent)}
nav.tabs button.add{background:var(--accent);color:var(--accent-ink)}

.overlay{position:fixed;inset:0;background:rgba(5,10,14,.55);display:grid;place-items:end center;padding:16px;z-index:20}
.dialog{background:var(--card);border-radius:16px;padding:20px;max-width:520px;width:100%;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom)}
.dialog h2{font-size:24px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row-actions{justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--road);color:var(--road-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.demo-stripe{background:repeating-linear-gradient(135deg,var(--accent) 0 14px,#1d1600 14px 28px);padding:4px}
.demo-stripe .in{background:var(--accent);color:var(--accent-ink);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 12px;border-radius:6px;font-weight:700;font-size:14px;letter-spacing:.03em}
.demo-stripe button{background:var(--accent-ink);color:var(--accent);border:0;border-radius:8px;min-height:36px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer}
.welcome{padding:16px;display:grid;gap:14px}
.choice{display:grid;gap:4px;text-align:left;width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.choice.primary{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.choice b{font-family:var(--display);font-size:24px;font-weight:700}
.choice span{color:var(--muted);font-size:15px}
.lede{font-size:18px;margin:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.steps-title{font-weight:700;margin-top:4px}
.mutedp{margin:0;color:var(--muted);font-size:15px}
.install{border:2px solid var(--accent)}
.install ol{margin:0;padding-left:22px;display:grid;gap:6px;font-size:16px}
.qr{background:#fff;padding:12px;border-radius:12px;justify-self:center;line-height:0}
.qr img,.qr canvas{width:200px;height:200px}
.foot-note{font-size:13px;color:var(--muted);text-align:center;padding:0 8px}
@media (prefers-reduced-motion: no-preference){
  .bar span{transition:width .4s ease}
}
</style>
</head>

/* =========================================================
   2. CALC — pure math, no screens, no storage
   ========================================================= */
const Calc = {
  toMin(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60 + m; },
  lengthMin(start, end){ let a = Calc.toMin(start), b = Calc.toMin(end); if (b < a) b += 1440; return b - a; },
  cents(x){ const n = Number(x); return Number.isFinite(n) ? Math.round(n*100) : 0; },
  reserve(grossCents, pct){ return Math.round(grossCents * pct / 100); },
  parseDate(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); },
  iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); },
  addDays(iso, n){ const d = Calc.parseDate(iso); d.setDate(d.getDate()+n); return Calc.iso(d); },
  weekStart(iso, startDay){ const d = Calc.parseDate(iso); const back = (d.getDay() - startDay + 7) % 7; d.setDate(d.getDate()-back); return Calc.iso(d); },
  hoursLeft(targetMin, workedMin){
    const left = targetMin - workedMin;
    return { over: left < 0, text: (Math.round(Math.abs(left)/6)/10).toFixed(1) };
  },
  derive(r){
    const minutes = Calc.lengthMin(r.start, r.end);
    const gross = r.baseCents + r.tipsCents;
    return { ...r, minutes, gross, spendable: gross - r.reserveCents };
  },
  totals(list){
    return list.reduce((t,r)=>{ t.count++; t.minutes+=r.minutes; t.gross+=r.gross; t.reserve+=r.reserveCents;
      t.spendable+=r.spendable; t.miles+=r.miles; t.gas+=r.gasCents; return t; },
      {count:0,minutes:0,gross:0,reserve:0,spendable:0,miles:0,gas:0});
  }
};

/* =========================================================
   3. STORE — the data layer. Screens only talk to this.
      Later, swap localStorage for an account backend here.
   ========================================================= */
const Store = (() => {
  const PREFS = "fdh.prefs", REAL = "fdh.real", DEMO = "fdh.demo", OLD = "flexDriverHub.v1";
  const mem = {};
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const read = k => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e) { return null; } };
  const write = (k, v) => { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { /* memory only */ } };
  const get = k => (k in mem) ? mem[k] : (mem[k] = read(k));
  const defaults = () => ({ reservePct: 0, reserveSet: false, targetHours: 40, weekStart: 1 });
  const valid = d => d && d.settings && Array.isArray(d.routes);

  function demoSeed(){
    const today = Calc.iso(new Date());
    const mk = (offset, start, end, base, tips, miles, gas, notes) => {
      const baseCents = Calc.cents(base), tipsCents = Calc.cents(tips);
      return { id: uid(), date: Calc.addDays(today, -offset), start, end, baseCents, tipsCents,
        miles, gasCents: Calc.cents(gas), notes, reservePct: 25,
        reserveCents: Calc.reserve(baseCents+tipsCents, 25), edited:false, editedAt:null,
        createdAt: Date.now() - offset*86400000 };
    };
    return {
      settings: { reservePct: 25, reserveSet: true, targetHours: 40, weekStart: 1 },
      routes: [
        mk(0, "08:00","12:30", 72, 8, 41.2, 9.5, "Whole Foods block, 2 stops cancelled"),
        mk(1, "13:00","17:15", 68, 0, 38.6, 8.75, ""),
        mk(2, "21:00","01:30", 81, 14.5, 52.0, 11.2, "Night logistics, ran past midnight"),
        mk(5, "10:00","13:30", 57, 6, 33.4, 7.4, ""),
        mk(9, "07:30","11:00", 54, 0, 29.9, 6.8, "Short block, light traffic"),
        mk(12, "15:00","19:00", 76, 11, 44.7, 10.1, ""),
        mk(16, "09:00","12:00", 52, 4, 27.3, 6.2, "")
      ]
    };
  }
  function prefs(){
    let p = get(PREFS);
    if (!p){
      p = { mode: null, lang: "en", lastBackup: null };
      const old = read(OLD);  /* carry real routes over from the first concept */
      if (valid(old)){
        p.lang = old.settings.lang || "en";
        const mine = old.routes.filter(r => !r.example);
        if (mine.length){ const { lang, ...s } = old.settings; write(REAL, { settings: { ...defaults(), ...s }, routes: mine }); p.mode = "real"; }
        try { localStorage.removeItem(OLD); } catch(e) {}
      }
      write(PREFS, p);
    }
    return p;
  }
  const key = () => prefs().mode === "demo" ? DEMO : REAL;
  function ds(k = key()){
    let d = get(k);
    if (!valid(d)){ d = k === DEMO ? demoSeed() : { settings: defaults(), routes: [] }; write(k, d); }
    return d;
  }
  const save = () => write(key(), ds());

  return {
    get mode(){ return prefs().mode; },
    get prefs(){ return prefs(); },
    setPrefs(patch){ write(PREFS, { ...prefs(), ...patch }); },
    get settings(){ return { ...ds().settings, lang: prefs().lang }; },
    saveSettings(patch){
      const { lang, ...rest } = patch;
      if (lang) this.setPrefs({ lang });
      if (Object.keys(rest).length){ Object.assign(ds().settings, rest); save(); }
    },
    routes(){ return ds().routes.map(Calc.derive); },
    realCount(){ return ds(REAL).routes.length; },
    get(id){ const r = ds().routes.find(x=>x.id===id); return r ? Calc.derive(r) : null; },
    upsert(input){
      const d = ds();
      const record = { ...input, reserveCents: Calc.reserve(input.baseCents + input.tipsCents, input.reservePct) };
      const i = d.routes.findIndex(x=>x.id===input.id);
      if (i >= 0) d.routes[i] = { ...d.routes[i], ...record, edited:true, editedAt: Date.now() };
      else d.routes.push({ ...record, id: uid(), edited:false, editedAt:null, createdAt: Date.now() });
      save();
      return i >= 0 ? "updated" : "saved";
    },
    remove(id){ const d = ds(); d.routes = d.routes.filter(x=>x.id!==id); save(); },
    recalcAll(pct){
      const d = ds();
      d.routes.forEach(r=>{ r.reservePct = pct; r.reserveCents = Calc.reserve(r.baseCents+r.tipsCents, pct); r.edited = true; r.editedAt = Date.now(); });
      save(); return d.routes.length;
    },
    resetDemo(){ write(DEMO, demoSeed()); },
    importRoutes(list, replace){
      const d = ds(REAL);
      const sig = r => [r.date, r.start, r.end, r.baseCents, r.tipsCents].join("|");
      const kept = replace ? [] : d.routes.slice();
      const seen = new Set(kept.map(sig));
      let added = 0, dup = 0;
      list.forEach(r => { const s = sig(r); if (seen.has(s)){ dup++; return; } seen.add(s); kept.push({ ...r, id: uid(), createdAt: Date.now() }); added++; });
      write(REAL, { settings: d.settings, routes: kept });
      this.setPrefs({ mode: "real" });
      return { added, dup };
    }
  };
})();

function t(key, vars){
  const lang = Store.settings.lang;
  let s = (STRINGS[lang] && STRINGS[lang][key] !== undefined) ? STRINGS[lang][key] : STRINGS.en[key];
  if (s === undefined) return key;
  if (vars && typeof s === "string") for (const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}
const loc = () => Store.settings.lang === "es" ? "es-US" : "en-US";
const money = c => new Intl.NumberFormat(loc(), {style:"currency", currency:"USD"}).format(c/100);
const one = x => new Intl.NumberFormat(loc(), {minimumFractionDigits:1, maximumFractionDigits:1}).format(x);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (iso, o) => new Intl.DateTimeFormat(loc(), o || {weekday:"short", month:"short", day:"numeric"}).format(Calc.parseDate(iso));
const fmtTime = hhmm => { const [h,m] = hhmm.split(":").map(Number); return new Intl.DateTimeFormat(loc(), {hour:"numeric", minute:"2-digit"}).format(new Date(2000,0,1,h,m)); };
const countLabel = n => n === 0 ? t("routesZero") : n === 1 ? t("routesOne") : t("routesMany", {n});
const todayIso = () => Calc.iso(new Date());

function periods(){
  const s = Store.settings, today = todayIso(), all = Store.routes();
  const wk = Calc.addDays(Calc.weekStart(today, s.weekStart), -7 * ui.weekOffset);
  return {
    weekStartIso: wk,
    today: all.filter(r => r.date === today),
    week: all.filter(r => Calc.weekStart(r.date, s.weekStart) === wk),
    month: all.filter(r => r.date.slice(0,7) === today.slice(0,7))
  };
}

function device(){

let qrLib = null;
function fillQr(){
  const boxes = document.querySelectorAll("[data-qr]:not([data-done])");
  if (!boxes.length) return;
  if (!qrLib) qrLib = new Promise((res, rej) => { const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    sc.onload = () => res(window.QRCode); sc.onerror = () => { qrLib = null; rej(); }; document.head.appendChild(sc); });
  qrLib.then(Q => boxes.forEach(b => { if (b.dataset.done) return; b.dataset.done = "1";
    new Q(b, { text: b.dataset.qr, width: 200, height: 200, correctLevel: Q.CorrectLevel.M }); }), () => {
    boxes.forEach(b => { b.style.display = "none"; }); });
}

function csvCell(v){ const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function buildCsv(){
  const list = Store.routes().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const d2 = c => (c/100).toFixed(2);
  const rows = [t("csvHeaders")];
  list.forEach(r => rows.push([r.date, r.start, r.end, (r.minutes/60).toFixed(2), d2(r.baseCents), d2(r.tipsCents), d2(r.gross),
    r.reservePct, d2(r.reserveCents), d2(r.spendable), Number(r.miles).toFixed(1), d2(r.gasCents), r.notes, r.edited ? t("yes") : t("no")]));
  const x = Calc.totals(list);
  const base = list.reduce((s,r)=>s+r.baseCents,0), tips = list.reduce((s,r)=>s+r.tipsCents,0);
  rows.push([t("csvTotal"), "", "", (x.minutes/60).toFixed(2), d2(base), d2(tips), d2(x.gross), "", d2(x.reserve), d2(x.spendable), x.miles.toFixed(1), d2(x.gas), "", ""]);
  return rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
}

async function downloadCsv(){
  const filename = `flex-driver-hub-${todayIso()}.csv`;
  try {
    if (downloadsApi){ await downloadsApi.save({ filename, data: buildCsv() }); markBackup(); return; }
    const blob = new Blob([buildCsv()], {type:"text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    markBackup();
  } catch(e) { /* declined or blocked: the copy box stays open as the fallback */ }
}

   6. CHECKS — the known example week from the build plan
   ========================================================= */
function runChecks(){
  const out = [], ck = (key, pass, detail) => out.push({key, pass, detail});
  const wk = [["08:00","12:30"],["13:00","17:15"],["21:00","01:30"]].map(([s,e])=>Calc.lengthMin(s,e));
  ck("chkLengths", wk.join(",")==="270,255,270", wk.map(m=>(m/60)+" h").join(" + "));
  const total = wk.reduce((a,b)=>a+b,0), hl = Calc.hoursLeft(2400, total);
  ck("chkHours", total===795 && !hl.over && hl.text==="26.8", `${total/60} h → ${hl.text}`);
  const ov = Calc.hoursLeft(2400, 2700);
  ck("chkOver", ov.over && ov.text==="5.0", `45 h → ${ov.text} ${ov.over ? "over" : "left"}`);
  const g = Calc.cents(60)+Calc.cents(10), r = Calc.reserve(g,25);
  ck("chkReserve", g===7000 && r===1750 && g-r===5250, `${g/100} × 25% = ${(r/100).toFixed(2)} · ${((g-r)/100).toFixed(2)}`);
  const r2 = Calc.reserve(Calc.cents(83.47), 27.5);
  ck("chkReserveOdd", r2===2295, `83.47 × 27.5% = ${(r2/100).toFixed(2)}`);
  const sun = Calc.weekStart("2026-01-04",1), mon = Calc.weekStart("2026-01-05",1);
  ck("chkWeek", sun==="2025-12-29" && mon==="2026-01-05", `${sun} ≠ ${mon}`);
  const sun0 = Calc.weekStart("2026-01-04",0), mon0 = Calc.weekStart("2026-01-05",0);
  ck("chkWeekSun", sun0===mon0 && sun0==="2026-01-04", `${sun0} = ${mon0}`);
  return out;
}

/* =========================================================
   7b. SCREENSHOT READER — reads the driver's own screenshot on the phone
   ========================================================= */
const MONTHS = {jan:0,ene:0,feb:1,mar:2,apr:3,abr:3,may:4,jun:5,jul:6,aug:7,ago:7,sep:8,sept:8,oct:9,nov:10,dec:11,dic:11};
function guessYear(m, d){
  const now = new Date(); let y = now.getFullYear();
  if (new Date(y, m, d) > now) y -= 1;   // screenshots are of past work
  return y;
}
function findDate(line){
  const low = line.toLowerCase(); let m;
  if (/\b(today|hoy)\b/.test(low)) return todayIso();
  if (/\b(yesterday|ayer)\b/.test(low)) return Calc.addDays(todayIso(), -1);
  if ((m = low.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec|ene|abr|ago|dic)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?/))){
    const mo = MONTHS[m[1]], d = +m[2]; if (d < 1 || d > 31) return null;
    return Calc.iso(new Date(m[3] ? +m[3] : guessYear(mo, d), mo, d));
  }
  if ((m = low.match(/\b(\d{1,2})\s+de\s+(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[a-z]*\.?(?:\s+(?:de\s+)?(\d{4}))?/))){
    const mo = MONTHS[m[2]], d = +m[1]; if (d < 1 || d > 31) return null;
    return Calc.iso(new Date(m[3] ? +m[3] : guessYear(mo, d), mo, d));
  }
  if ((m = low.match(/(?:^|[^\d$.])(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?(?![\d.])/))){
    const mo = +m[1]-1, d = +m[2]; if (mo < 0 || mo > 11 || d < 1 || d > 31) return null;
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : guessYear(mo, d);
    return Calc.iso(new Date(y, mo, d));
  }
  return null;
}
const hm = (h, mi, ap) => { let H = (+h) % 12; if (/p/i.test(ap)) H += 12; return String(H).padStart(2,"0") + ":" + String(+(mi || 0)).padStart(2,"0"); };
function parseShot(text){
  /* Built from the real Flex Earnings list: each block is a card with
     "date ... $amount" on one row, the time range under it, then "Paid".
     Payout rows (Instant cash out, Payment sent) are not routes. */
  const lines = String(text).split(/\n/).map(l => l.replace(/[|]/g," ").trim()).filter(Boolean);
  const timeRe = /(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m\.?\s*(?:-|–|—|~|to|a)\s*(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m\.?/i;
  const moneyRe = /\$\s?(\d{1,4}(?:,\d{3})*(?:\.\d{2})?)/g;
  const payoutRe = /cash\s*out|payment\s*sent|pago\s*enviado|retiro|deposit|dep[oó]sito|transfer/i;
  let cur = null, items = [], pending = [], open = null;   // open = route whose details may follow
  const take = (it, line, amt) => {
    const low = line.toLowerCase();
    if (/tip|propina/.test(low)) it.tips = +((it.tips || 0) + amt).toFixed(2);
    else if (/total/.test(low)) it.total = amt;
    else if (it.base === null) it.base = amt;
    else if (it.total === null) it.total = amt;
  };
  let skipNextDate = false;
  for (const line of lines){
    if (payoutRe.test(line)){ pending = []; open = null; skipNextDate = !findDate(line); continue; }
    const d = findDate(line);
    if (d){
      cur = d;
      if (skipNextDate){ skipNextDate = false; continue; }   // date row of a payout, not a route
      pending = []; open = null;                             // a new card starts
    }
    skipNextDate = false;
    const tm = line.match(timeRe);
    const rest = tm ? line.replace(timeRe, "") : line;
    const amts = [...rest.matchAll(moneyRe)].map(x => Number(x[1].replace(/,/g,"")));
    if (tm){
      const it = { date: cur || todayIso(), start: hm(tm[1],tm[2],tm[3]), end: hm(tm[4],tm[5],tm[6]), base:null, tips:null, total:null };
      pending.forEach(([l,a]) => take(it, l, a)); pending = [];
      items.push(it); open = it;
      if (amts.length) take(it, rest, amts[amts.length-1]);
      continue;
    }
    if (!amts.length) continue;
    const amt = amts[amts.length-1];
    if (open) take(open, rest, amt);       // detail lines under a route (Base pay, Tips, Total)
    else pending.push([rest, amt]);        // amount on the date row: belongs to the time range below
  }
  if (!items.length && pending.length){
    const it = { date: cur || todayIso(), start:"", end:"", base:null, tips:null, total:null };
    pending.forEach(([l,a]) => take(it, l, a)); items.push(it);
  }
  return items.map(it => {
    let base = it.base, tips = it.tips;
    if (it.total !== null && base !== null && tips === null && it.total > base) tips = +(it.total - base).toFixed(2);
    if (base === null && it.total !== null) base = +(it.total - (tips || 0)).toFixed(2);
    return { keep:true, date: it.date, start: it.start, end: it.end, base: base === null ? "" : base.toFixed(2), tips: (tips || 0).toFixed(2), miles:"", gas:"0.00" };
  });
}

let ocrScript = null;
function loadOcr(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (!ocrScript) ocrScript = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = () => window.Tesseract ? res(window.Tesseract) : rej(new Error("missing"));
    sc.onerror = () => { ocrScript = null; rej(new Error("load")); };
    document.head.appendChild(sc);
  });
  return ocrScript;
}
function prepImage(file){   // grayscale, flip dark mode to light, enlarge small screenshots
  return new Promise((res) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const scale = img.width < 1000 ? 2 : 1;
        const c = document.createElement("canvas"); c.width = img.width*scale; c.height = img.height*scale;
        const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
        const d = x.getImageData(0, 0, c.width, c.height), px = d.data; let sum = 0;
        for (let i = 0; i < px.length; i += 4){ const g = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2]; px[i] = px[i+1] = px[i+2] = g; sum += g; }
        if (sum / (px.length/4) < 110) for (let i = 0; i < px.length; i += 4){ px[i] = px[i+1] = px[i+2] = 255 - px[i]; }
        x.putImageData(d, 0, 0); URL.revokeObjectURL(url); res(c);
      } catch(e) { URL.revokeObjectURL(url); res(file); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function readShots(files){
  const status = msg => { const el = document.getElementById("shotStatus"); if (el) el.textContent = msg; };
  status(t("shotLoading"));
  let T, worker;
  try { T = await loadOcr(); } catch(e) { status(t("shotFail")); toast(t("shotFail")); return; }
  let i = 0;
  try {
    worker = await T.createWorker("eng", 1, { logger: m => { if (m.status === "recognizing text") status(t("shotReading", {i, n: files.length, p: Math.round(m.progress*100)})); } });
    try { await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" }); } catch(_) {}
    let raw = "";
    for (const f of files){ i++; status(t("shotReading", {i, n: files.length, p: 0})); const { data } = await worker.recognize(await prepImage(f)); raw += data.text + "\n"; }
    await worker.terminate();
    const items = parseShot(raw);
    if (!items.length){ status(t("shotNone")); toast(t("shotNone")); return; }
    ui.review = { items, raw, errors: {} };
    go("review");
  } catch(e) {
    try { worker && worker.terminate(); } catch(_) {}
    status(t("shotFail")); toast(t("shotFail"));
  }
}
function saveReview(){
  const r = ui.review; if (!r) return;
  const kept = r.items.map((it, i) => [it, i]).filter(([it]) => it.keep);
  if (!kept.length){ toast(t("reviewNoneChecked")); return; }
  const errors = {};
  kept.forEach(([it, i]) => {
    const e = {};
    if (!/^\d{4}-\d{2}-\d{2}$/.test(it.date)) e.date = 1;

    if (!it.end || it.end === it.start) e.end = 1;
    if (!isNonNeg(String(it.base))) e.base = 1;
    ["tips","gas","miles"].forEach(k => { if (String(it[k]).trim() !== "" && !isNonNeg(String(it[k]))) e[k] = 1; });
    if (Object.keys(e).length) errors[i] = e;
  });
  if (Object.keys(errors).length){ r.errors = errors; render(); window.scrollTo(0,0); return; }
  const pct = Store.settings.reservePct;

    miles: Math.round(Number(it.miles || 0)*10)/10, gasCents: Calc.cents(it.gas || 0), notes: "", reservePct: pct }));
  ui.review = null; toast(t("reviewSaved", {n: kept.length})); go("home");
}

/* =========================================================
   8. RESTORE FROM BACKUP CSV
   ========================================================= */
function parseCsv(text){
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function normDate(s){
  s = String(s||"").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/))) return `${m[3].length===2 ? "20"+m[3] : m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
  return null;
}
function normTime(s){
  const m = String(s||"").trim().toLowerCase().replace(/\./g,"").match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm|a|p)?$/);
  if (!m) return null;
  let h = +m[1]; const mi = +m[2];
  if (m[3]){ const pm = m[3][0] === "p"; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; }
  if (h > 23 || mi > 59) return null;
  return String(h).padStart(2,"0") + ":" + String(mi).padStart(2,"0");
}
const csvMoney = s => { const n = Number(String(s ?? "").replace(/[$,\s]/g,"")); return Number.isFinite(n) && n >= 0 ? Math.round(n*100) : null; };
function routesFromCsv(text){
  const rows = parseCsv(text);
  if (!rows.length) return { error: "restoreEmpty" };
  const head = rows[0].map(h => h.trim().toLowerCase());
  if (![STRINGS.en.csvHeaders, STRINGS.es.csvHeaders].some(k => k.every((h,i) => head[i] === h))) return { error: "restoreBadFile" };
  const out = []; let bad = 0;
  rows.slice(1).forEach(r => {
    if (/^total$/i.test((r[0]||"").trim())) return;
    const date = normDate(r[0]), start = normTime(r[1]), end = normTime(r[2]);
    const base = csvMoney(r[4]), tips = csvMoney(r[5] || "0"), pct = Number(r[7]), resv = csvMoney(r[8]);
    const miles = Number(r[10] || 0), gas = csvMoney(r[11] || "0");
    if (!date || !start || !end || start === end || base === null || tips === null || !Number.isFinite(pct) || resv === null || gas === null || !Number.isFinite(miles) || miles < 0){ bad++; return; }
    out.push({ date, start, end, baseCents: base, tipsCents: tips, reservePct: pct, reserveCents: resv,
      miles: Math.round(miles*10)/10, gasCents: gas, notes: (r[12]||"").trim(),
      edited: /^(yes|s[ií])$/i.test((r[13]||"").trim()), editedAt: null });
  });
  if (!out.length) return { error: "restoreNone" };
  return { routes: out, bad };
}

    ui.modal = {
      title: t("restoreTitle"),
      body: t("restoreBody", { n: countLabel(res.routes.length), from: fmtDate(dates[0]), to: fmtDate(dates[dates.length-1]), m: Store.realCount() }),
      note: res.bad ? t("restoreBodyBad", { b: res.bad }) : "",
      ok: t("restoreAdd"), alt: t("restoreReplace"),
      run: () => { const r = Store.importRoutes(res.routes, false); toast(t("restoreDone", { a: r.added, d: r.dup })); },
      altRun: () => { const r = Store.importRoutes(res.routes, true); toast(t("restoreDone", { a: r.added, d: r.dup })); }
    };
    renderModal();
  };
  reader.onerror = () => toast(t("restoreBadFile"));
  reader.readAsText(file);
});

/* =========================================================
   9. INSTALLED APP: offline support + ask the phone to keep data
   ========================================================= */
try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self)
    navigator.serviceWorker.register("sw.js").catch(() => {});
} catch(e) {}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e) {}

render();
</script>
</body>
